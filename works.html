  <h2>《山丹丹开花红艳艳》</h2>
  <p>由关鹤岩、冯福宽、李若冰、刘烽集体作词，堂永诚记谱，中央乐团合唱团演唱，旋律带有浓郁的陕北民歌风味。</p >
  < img src="shan-dan-dan.png" alt="山丹丹开花红艳艳 简谱">

  <h2>作品背景</h2>
  <p>歌曲以陕北信天游为素材，描绘中央红军到达陕北时人民群众热烈欢迎的场景。</p >

  <h2>艺术特点</h2>
  <p>旋律采用陕北民歌的调式与节奏，情感真挚、朗朗上口。</p >

  <h2>思政价值</h2>
  <p>通过赏析，学生可以理解红色音乐如何承载革命情感、传播理想信念。</p >
