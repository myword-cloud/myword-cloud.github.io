  <h2>延安十三年历史讲解</h2>
  <p>1935 年至 1948 年，中共中央在延安领导中国革命十三年，这段历史孕育了丰富的红色音乐文化，成为思政美育的重要资源。</p >

  <h2>红色音乐发展脉络</h2>
  <p>从鲁艺成立到文艺座谈会，从民间音乐采集到红色歌曲创作，延安时期的红色音乐走过了一条民族化、大众化、革命化的发展道路。</p >

  <h2>延安精神内涵解读</h2>
  <p>坚定正确的政治方向、解放思想实事求是、全心全意为人民服务、自力更生艰苦奋斗——延安精神是红色音乐最深层的灵魂。</p >
